# Esegue i test PHPUnit a ogni push.
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/php:8.0
    working_directory: ~/project/day2Week9
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
      - run:
          name: Install dependencies
          command: composer install --no-interaction --prefer-dist
      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor
      - run:
          name: Prepare environment
          command: |
            cp .env.example .env
            php artisan key:generate
      - run:
          name: Run tests
          command: php artisan test

workflows:
  test:
    jobs:
      - test
